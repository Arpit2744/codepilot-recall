name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    name: API tests (Python 3.12 + PostgreSQL 16)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codepilot
          POSTGRES_PASSWORD: codepilot
          POSTGRES_DB: codepilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codepilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      ENVIRONMENT: test
      # Real PostgreSQL: exercises the same engine path production uses.
      DATABASE_URL: postgresql+psycopg://codepilot:codepilot@localhost:5432/codepilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.lock
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (pytest)
        run: pytest

  worker:
    name: Worker tests (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/worker
    env:
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/worker/requirements.lock
      - name: Install API package (models/importer used by sync tasks)
        run: python -m pip install -e ../api
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (pytest)
        run: pytest

  web:
    name: Web lint, unit tests, build (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint)
        run: npm run web:lint
      - name: Unit tests (vitest)
        run: npm run web:test
      - name: Build (next build)
        run: npm run web:build

  backup-restore:
    # Phase 5: real backup/restore rehearsal on a disposable PostgreSQL.
    name: Backup & restore rehearsal (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cpr_src
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      SRC_URL: postgresql+psycopg://postgres:postgres@localhost:5432/cpr_src
      DST_URL: postgresql+psycopg://postgres:postgres@localhost:5432/cpr_dst
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.lock
      - name: Install API package
        run: python -m pip install -e .
      - name: Migrate the source database
        run: |
          export DATABASE_URL="$SRC_URL"
          python -m alembic upgrade head 2>&1 | tee /tmp/migrate.log || {
            tail -c 800 /tmp/migrate.log | tr '\r\n' '  ' | sed 's/%/%25/g' | tail -c 600 | xargs -I{} printf '::error title=alembic-migrate::%s\n' "{}"
            exit 1
          }
      - name: Seed representative data
        run: |
          export DATABASE_URL="$SRC_URL"
          python scripts/seed_demo.py 2>&1 | tee /tmp/seed.log || {
            tail -c 800 /tmp/seed.log | tr '\r\n' '  ' | sed 's/%/%25/g' | tail -c 600 | xargs -I{} printf '::error title=seed::%s\n' "{}"
            exit 1
          }
      - name: Verify seed landed in the source database
        run: |
          export DATABASE_URL="$SRC_URL"
          python -c "import uuid; from sqlalchemy import create_engine, text; e = create_engine('$SRC_URL'); c = e.connect(); print('users:', c.execute(text('select count(*) from users')).scalar()); assert c.execute(text('select count(*) from user_sessions')).scalar() == 0" 2>&1 | tee /tmp/verify_seed.log || {
            tail -c 800 /tmp/verify_seed.log | tr '\r\n' '  ' | tail -c 600 | xargs -I{} printf '::error title=verify-seed::%s\n' "{}"
            exit 1
          }
      # pg_dump/pg_restore MUST match the server major version (a newer
      # client emits SET transaction_timeout, which PG16 rejects on restore),
      # so the tools run from the matching postgres:16-alpine image with
      # --network host to reach the service container's published port.
      - name: Create backup (pg_dump 16, custom format, out of any artifact)
        run: |
          docker run --rm --network host -v /tmp:/tmp -e PGPASSWORD=postgres \
            postgres:16-alpine \
            pg_dump -h 127.0.0.1 -U postgres -Fc cpr_src -f /tmp/cpr_backup.dump
          ls -la /tmp/cpr_backup.dump
      - name: Restore into a fresh empty database
        run: |
          set -o pipefail
          docker run --rm --network host postgres:16-alpine \
            psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE cpr_dst" 2>&1 | tee /tmp/createdb.log || {
            tail -c 600 /tmp/createdb.log | tr '\r\n' '  ' | xargs -I{} printf '::error title=createdb::%s\n' "{}"
            exit 1
          }
          docker run --rm --network host -v /tmp:/tmp -e PGPASSWORD=postgres \
            postgres:16-alpine \
            pg_restore -h 127.0.0.1 -U postgres -d cpr_dst --no-owner --verbose /tmp/cpr_backup.dump 2>&1 | tee /tmp/restore.log || {
            grep -E "error|already exists|must be owner" /tmp/restore.log | head -5 | tr '\r\n' '  ' | sed 's/%/%25/g' | tail -c 800 | xargs -I{} printf '::error title=pg_restore-errors::%s\n' "{}"
            exit 1
          }
      - name: Verify schema and row integrity in the restored database
        run: |
          export DATABASE_URL="$DST_URL"
          python scripts/verify_backup.py
      - name: Clean up throwaway data
        if: always()
        run: |
          rm -f /tmp/cpr_backup.dump
          PGPASSWORD=postgres psql -h localhost -U postgres -c "DROP DATABASE IF EXISTS cpr_dst" || true

  e2e-auth:
    # Phase 5: integrated auth E2E — real API + PostgreSQL + browser; two
    # users register/login/onboard through the actual UI.
    name: Integrated auth E2E (API + PostgreSQL + Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cpr_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install API package
        working-directory: services/api
        run: python -m pip install -e .
      - name: Migrate test database and start the API
        working-directory: services/api
        run: |
          export DATABASE_URL="postgresql+psycopg://postgres:postgres@localhost:5432/cpr_e2e"
          export ENVIRONMENT=test
          export REDIS_URL=""
          # Generous limits so the multi-scenario suite is not throttled;
          # rate limiting itself is covered by dedicated unit tests.
          export RATE_LIMIT_REGISTER="1000:3600"
          export RATE_LIMIT_LOGIN_IP="1000:900"
          export RATE_LIMIT_LOGIN_EMAIL="1000:900"
          python -m alembic upgrade head
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 2
          done
      - name: Install web dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run integrated auth E2E
        run: npx playwright test -c playwright.auth.config.ts
      - name: API log on failure
        if: failure()
        run: tail -100 /tmp/api.log

  compose:
    # This machine cannot run Docker (virtualization disabled, BIOS locked);
    # GitHub-hosted Linux runners provide the container verification instead.
    name: Docker Compose build & smoke (Linux runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build api image
        run: docker build -f infra/docker/api.Dockerfile .
      - name: Build worker image
        run: docker build -f infra/docker/worker.Dockerfile .
      - name: Build web image
        run: docker build -f infra/docker/web.Dockerfile .
      - name: Start the stack
        run: docker compose up -d --wait
      - name: Wait for API readiness (PostgreSQL + Alembic migrations)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health/ready; then
              echo "API ready after ~$((i * 5))s"; exit 0
            fi
            sleep 5
          done
          echo "API never became ready"
          exit 1
      - name: Web responds on :3000
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:3000 || true)
            if [ "$code" = "200" ]; then echo "web ready"; exit 0; fi
            sleep 5
          done
          echo "web never returned 200 (last: $code)"
          exit 1
      - name: Diagnostics (published as annotations)
        if: failure()
        run: |
          emit() {
            title="$1"; body="$2"
            body=$(printf '%s' "$body" | sed 's/%/%25/g' | tr '\r\n' '  ' | tail -c 380)
            printf '::error title=%s::%s\n' "$title" "$body"
          }
          emit "compose ps" "$(docker compose ps 2>&1 | tail -8)"
          emit "api logs tail" "$(docker compose logs api 2>&1 | tail -c 1200)"
          emit "web logs tail" "$(docker compose logs web 2>&1 | tail -c 500)"
          emit "curl 8000/health" "$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:8000/health 2>&1)"
          emit "curl 3000" "$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:3000 2>&1)"
          exit 1
      - name: Teardown
        if: always()
        run: docker compose down -v --remove-orphans

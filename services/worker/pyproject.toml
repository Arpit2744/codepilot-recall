[project]
name = "codepilot-worker"
version = "0.1.0"
description = "CodePilot Recall — background worker (Celery)"
requires-python = ">=3.11"
dependencies = [
    "celery==5.6.3",
    "redis==8.1.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
    # Sync tasks also import the `app` package from services/api (models,
    # repositories, importer, CF client). Install it explicitly first —
    # `pip install -e ../api` — here, in CI, and in the worker Dockerfile.
    # (A file: path dependency proved fragile across pip versions.)
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[project]
name = "codepilot-api"
version = "0.1.0"
description = "CodePilot Recall — FastAPI backend service"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.55",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.6",
    "redis==8.1.0",
    "httpx==0.28.1",
    # FSRS spaced-repetition scheduler (Phase 3); API verified against the
    # installed 6.3.2 — see app/integrations/fsrs/adapter.py.
    "fsrs==6.3.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
